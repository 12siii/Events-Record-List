name: Deploy with Public Tunnel

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Start server in background
        run: |
          npm start &
          sleep 5
          curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/ || true
          echo ""
          echo "=== Server started ==="

      - name: Download cloudflared
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -O /tmp/cloudflared
          chmod +x /tmp/cloudflared
          /tmp/cloudflared --version

      - name: Start tunnel and get public URL
        run: |
          # Start cloudflared tunnel in background and capture log output
          /tmp/cloudflared tunnel --url http://localhost:3000 --no-autoupdate --logfile /tmp/tunnel.log 2>&1 &
          TUNNEL_PID=$!
          echo "Tunnel PID: $TUNNEL_PID"
          
          # Wait for tunnel to get a URL (scan the log file)
          echo "Waiting for tunnel URL..."
          for i in $(seq 1 30); do
            sleep 3
            # Extract the trycloudflare.com URL from the log
            URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' /tmp/tunnel.log 2>/dev/null | head -1 || true)
            if [ -n "$URL" ]; then
              echo "=============================================="
              echo "  🎉 部署成功！Public URL 已获取"
              echo "  🌐 公网访问地址: $URL"
              echo "=============================================="
              echo ""
              echo "你可以将上面的链接分享给你的好友，大家可以一起共建打卡清单！"
              echo ""
              echo "注意：GitHub Actions 最长运行 6 小时，到期后请重新运行此 workflow。"
              # Save URL to a file for artifact
              echo "$URL" > /tmp/public-url.txt
              echo "$TUNNEL_PID" > /tmp/tunnel-pid.txt
              
              # Also write to GitHub step summary
              echo "## 🌐 公网访问地址" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "点击访问你的打卡清单应用：[$URL]($URL)" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "### 功能说明" >> $GITHUB_STEP_SUMMARY
              echo "- 📝 邀请好友一起共建打卡清单" >> $GITHUB_STEP_SUMMARY
              echo "- 🔀 任务支持拖拽排序" >> $GITHUB_STEP_SUMMARY
              echo "- 📸 每个任务完成需双方确认并上传图片" >> $GITHUB_STEP_SUMMARY
              echo "- 🎨 可生成整个清单的纪念册（按完成顺序）" >> $GITHUB_STEP_SUMMARY
              echo "- 👤 支持单人模式，自己设定目标自己完成" >> $GITHUB_STEP_SUMMARY
              echo "- 🏠 主页展示历史创建过、进行中的任务" >> $GITHUB_STEP_SUMMARY
              echo "- 🎯 创建时设定目标件数，中途可提前结束" >> $GITHUB_STEP_SUMMARY
              
              # Keep the job alive by waiting
              echo ""
              echo "服务器正在运行中...（保持运行最长 6 小时）"
              echo "按 Ctrl+C 可手动停止。保持此页面打开可查看 URL。"
              # Just wait - don't exit, keep tunnel alive
              # But first, upload URL as artifact using a separate step, so we wait here
              while true; do sleep 60; done
            fi
          done
          
          echo "❌ 未能获取公网 URL，请查看隧道日志："
          cat /tmp/tunnel.log || true
          exit 1

      - name: Upload public URL artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-url
          path: /tmp/public-url.txt
          if-no-files-found: ignore
