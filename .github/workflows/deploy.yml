name: Deploy with Public Tunnelon:  workflow_dispatch:  push:    branches: [main, master]jobs:  deploy:    runs-on: ubuntu-latest    timeout-minutes: 360    steps:      - name: Checkout code        uses: actions/checkout@v4      - name: Setup Node.js        uses: actions/setup-node@v4        with:          node-version: '20'      - name: Install dependencies        run: npm install      - name: Start server in background        run: |          npm start &          sleep 5          curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/ || true          echo ""          echo "=== Server started ==="      - name: Download cloudflared        run: |          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -O /tmp/cloudflared          chmod +x /tmp/cloudflared          /tmp/cloudflared --version      - name: Start tunnel and get public URL        run: |          /tmp/cloudflared tunnel --url http://localhost:3000 --no-autoupdate --logfile /tmp/tunnel.log 2>&1 &          TUNNEL_PID=$!          echo "Tunnel PID: $TUNNEL_PID"          echo "Waiting for tunnel URL..."          for i in $(seq 1 30); do            sleep 3            URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' /tmp/tunnel.log 2>/dev/null | head -1 || true)            if [ -n "$URL" ]; then              echo "=============================================="              echo "  🎉 部署成功！Public URL 已获取"              echo "  🌐 公网访问地址: $URL"              echo "=============================================="              echo ""              echo "你可以将上面的链接分享给好友，大家一起打卡！"              echo ""              echo "注意：运行 6 小时后自动结束，请重新运行 workflow。"              echo "## 🌐 公网访问地址" >> $GITHUB_STEP_SUMMARY              echo "" >> $GITHUB_STEP_SUMMARY              echo "点击访问你的打卡清单应用：[$URL]($URL)" >> $GITHUB_STEP_SUMMARY              echo ""              echo "服务器正在运行中...（最长6小时）"              while true; do sleep 60; done            fi          done          echo "❌ 未能获取公网 URL，日志如下："          cat /tmp/tunnel.log || true          exit 1
